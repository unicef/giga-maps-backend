# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
    - develop
    - staging
  tags:
    include:
    - 'release-*'

name: $(SourceBranchName).$(Build.BuildId).$(Date:yyyyMMdd).$(Rev:r)

variables:
  dockerRegistryServiceConnection: $(DOCKER_SERVICE_CONNECTION)
  dockerfilePath: './Dockerfile'
  app: $(DOCKER_REPOSITORY)
  imageRepositoryDev: 'dev/$(app)'
  imageRepositoryStg: 'stg/$(app)'
  imageRepositoryProd: 'prod/$(app)'
  tag: '$(Build.BuildId)'
  pythonVersion: '3.8'
  SONAR_HOST_V: $(SONAR_HOST)
  SONAR_TOKEN_V: $(SONAR_TOKEN)

stages:
- stage: build_test
  displayName: Build and Test
  pool:
    vmImage: 'ubuntu-22.04'
  jobs:
  - job: Test
    steps:
    - task: Bash@3
      displayName: Print ENV
      inputs:
        targetType: 'inline'
        script: |
          printenv
          echo "$SONAR_HOST_V"
          echo "$SONAR_TOKEN_V"
      continueOnError: true
